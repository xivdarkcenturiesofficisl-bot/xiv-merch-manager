 svg+='</svg>';

 const topConcerts=[...byConcert.values()].sort((a,b)=>b.total-a.total).slice(0,5),best=Math.max(1,...topConcerts.map(x=>x.total));
 return `<div class="panel"><div class="row space"><h3 style="margin:0">🔥 Verkaufs-Dashboard</h3><span class="muted">Umsatz · letzte 12 Monate</span></div><div class="grid" style="margin-top:12px"><div><div class="muted">Erfasster Gesamtumsatz</div><div class="metric" style="color:#ffcf69">${money(total)}</div></div><div><div class="muted">Verkaufte Artikel</div><div class="metric">${units.toLocaleString('de-DE')} Stück</div></div><div><div class="muted">Verkaufspositionen</div><div class="metric">${valid.length}</div></div></div>${valid.length?`<div style="margin-top:20px;overflow-x:auto">${svg}</div><h3>🏆 Umsatzstärkste Konzerte</h3>${topConcerts.map((x,i)=>`<div style="margin:12px 0"><div class="row space"><strong>${i+1}. ${esc(x.name)}</strong><span>${money(x.total)} · ${x.qty} Stück</span></div><div style="background:#34343e;border-radius:8px;height:10px;margin-top:5px;overflow:hidden"><div style="width:${Math.max(0,x.total/best*100)}%;background:linear-gradient(90deg,#8f2831,#ed6565);height:100%;border-radius:8px"></div></div></div>`).join('')}`:'<p class="muted" style="margin-top:18px">Noch keine Verkäufe in Supabase erfasst. Sobald Verkäufe synchronisiert sind, erscheinen hier automatisch die Diagramme.</p>'}<p class="muted" style="font-size:12px">Auswertung basiert auf gespeicherten Verkaufspositionen in Supabase. Offline-Buchungen erscheinen nach erfolgreicher Synchronisierung.</p></div>`
}

async function handleProductPhoto(input){
 const id=input.dataset.product,file=input.files?.[0];if(!id||!file)return;
 if(!navigator.onLine)return alert('Für Foto-Uploads wird eine Internetverbindung benötigt.');
 if(!file.type.startsWith('image/'))return alert('Bitte eine Bilddatei auswählen.');
 if(file.size>12*1024*1024)return alert('Das Foto darf höchstens 12 MB groß sein.');
 const p=byId(id);if(!p)return;
 try{
  status('Foto wird vorbereitet …');
  const bitmap=await createImageBitmap(file);

// Bandcamp CSV Import: Vorschau, Zuordnung, serverseitig atomare Buchung.
let bcRows=[],bcHash='',bcPeriod='',bcKind='physical',bcFileName='';
function bcCSV(text){
 text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/,1)[0];const delimiter=(first.match(/\t/g)||[]).length>(first.match(/,/g)||[]).length?'\t':',';
 let rows=[],r=[],v='',quote=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){v+='"';i++}else quote=!quote}else if(c===delimiter&&!quote){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;r.push(v);if(r.some(x=>x.trim()))rows.push(r);r=[];v=''}else v+=c}
 r.push(v);if(r.some(x=>x.trim()))rows.push(r);
 if(rows.length<2)throw Error('Die CSV enthält keine Daten.');
 const head=rows.shift().map(x=>x.trim().replace(/^\ufeff/,''));return rows.map(a=>Object.fromEntries(head.map((h,i)=>[h,(a[i]||'').trim()])));
}
function bcNum(s){let x=String(s??'0').trim().replace(/[€\s]/g,'');if(x.includes(',')&&!x.includes('.'))x=x.replace(',','.');else if(x.includes(',')&&x.includes('.'))x=x.replace(/,/g,'');return Number(x)||0}
async function bcFile(file){if(!file)return;try{
 const bytes=await file.arrayBuffer();let text;
 const b=new Uint8Array(bytes);if(b[0]===255&&b[1]===254)text=new TextDecoder('utf-16le').decode(bytes);else if(b[0]===254&&b[1]===255)text=new TextDecoder('utf-16be').decode(bytes);else text=new TextDecoder('utf-8').decode(bytes);
 const rows=bcCSV(text),first=rows[0];if(!('Item name' in first)||!('Quantity' in first))throw Error('Bitte den Bandcamp-Verkaufsbericht mit den Spalten „Item name“ und „Quantity“ auswählen.');
 const hashBytes=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));bcHash=Array.from(hashBytes).map(x=>x.toString(16).padStart(2,'0')).join('');
 bcFileName=file.name;const match=file.name.match(/(20\d{2})(\d{2})\d{2}-(20\d{2})(\d{2})\d{2}/);bcPeriod=match&&match[1]===match[3]&&match[2]===match[4]?match[1]+'-'+match[2]:new Date().toISOString().slice(0,7);
 bcRows=rows.map((x,i)=>({...x,_i:i,_qty:bcNum(x.Quantity),_gross:bcNum(x['Gross revenue']),_digital:/digital|download/i.test(x['Item type']||'')})).filter(x=>x._qty>0);
 if(!bcRows.length)throw Error('Keine Verkaufspositionen mit positiver Menge gefunden.');render();
 }catch(e){alert('Bandcamp-CSV: '+e.message)}
}

async function bcApply(){if(!isAdmin())return alert('Nur Admins dürfen importieren.');if(!navigator.onLine)return alert('Import nur online möglich.');
 const period=$('bcPeriod')?.value?.trim();if(!/^20\d{2}-(0[1-9]|1[0-2])$/.test(period))return alert('Monat muss JJJJ-MM sein.');
 if(period==='2026-10')return alert('Oktober 2026 wurde bereits beim Startbestand berücksichtigt. Ein erneuter Import ist gesperrt.');
 const items=bcRows.map(x=>({key:String(x._i+1),name:x['Item name']||'',product_id:$('bcmap'+x._i)?.value||null,qty:x._qty,gross:x._gross}));
 if(items.some(x=>!Number.isSafeInteger(x.qty)||x.qty<=0))return alert('Ungültige Stückzahlen.');
 const deducted=items.filter(x=>x.product_id).reduce((a,x)=>a+x.qty,0),unmapped=items.filter(x=>!x.product_id).length;
 if(!confirm(`Bandcamp ${period} importieren?\n${deducted} Stück Lagerabzug aus ${items.length} Positionen.\n${unmapped} Positionen ohne Lagerabzug.\nDer Import kann nicht einfach rückgängig gemacht werden.`))return;
 try{const result=await rpc('xiv_import_bandcamp',{p_period:period,p_hash:bcHash,p_items:items});bcRows=[];await load();alert('Bandcamp-Bericht importiert. '+result+' Lagerstück(e) abgebucht.')}catch(e){err(e)}
}

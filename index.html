function photo(id,input){let f=input.files[0];if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let canvas=document.createElement('canvas');let k=Math.min(1,480/Math.max(img.width,img.height));canvas.width=Math.round(img.width*k);canvas.height=Math.round(img.height*k);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);byId(id).photo=canvas.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);save();render()};img.src=url}

function concertPrice(p){let c=cs();let v=c?.prices?.[p.id];return v===undefined?p.price:Number(v)}
function changeConcertPrice(id,value){let c=cs();if(!c)return;let n=Number(String(value).replace(',','.'));if(!Number.isFinite(n)||n<0){alert('Bitte gültigen Preis eingeben');render();return}c.prices=c.prices||{};c.prices[id]=Math.round(n*100)/100;save();render()}
function resetConcertPrice(id){let c=cs();if(!c)return;delete (c.prices||{})[id];save();render()}

function concertSold(cid,pid){return db.sales.filter(x=>x.concertId===cid&&x.productId===pid).reduce((a,x)=>a+x.qty,0)}
function concertRemaining(c,pid){if(!c)return 0;return Math.max(0,(Number(c.packing?.[pid]?.qty)||0)-concertSold(c.id,pid))}
// Actual saleable amount is limited by both concert allocation and global stock.
function saleable(c,p){return Math.max(0,Math.min(concertRemaining(c,p.id),stock(p)))}
function cartAvailable(c,p){return Math.max(0,saleable(c,p)-(cart[p.id]||0))}
function addToCart(id){
 const c=cs(),p=byId(id);if(!c||!p)return;
 if(cartAvailable(c,p)<=0){alert('Dieser Artikel ist für das Konzert nicht mehr verfügbar.');return}
 cart[id]=(cart[id]||0)+1;render();
 const basket=document.getElementById('pos-basket');
 if(basket){basket.scrollIntoView({behavior:'smooth',block:'center'});basket.classList.add('basket-highlight');setTimeout(()=>basket.classList.remove('basket-highlight'),1700)}
 const note=document.getElementById('basket-added-notice');if(note)note.textContent='✓ '+p.name+' '+(p.variant||'')+' im Warenkorb';
}
function packing(){
 let c=cs();if(!c&&db.concerts.length){selectedConcert=db.concerts[0].id;c=cs()}
 if(!c)return `<h2>Konzertliste</h2><p>Bitte zuerst ein Konzert anlegen.</p><button onclick="newConcert()">+ Konzert anlegen</button>`;
 c.packing=c.packing||{};
 const rows=db.products.filter(p=>(p.name+' '+p.variant+' '+p.sku).toLowerCase().includes(search.toLowerCase()));
 const selected=db.products.filter(p=>c.packing[p.id]);
 const total=selected.reduce((a,p)=>a+c.packing[p.id].qty*concertPrice(p),0);
 return `<h2>📦 Konzertliste / Übergabe</h2>
 <div class="panel"><label>Konzert <select onchange="selectedConcert=this.value;search='';render()">${db.concerts.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.date+' · '+x.name)}</option>`).join('')}</select></label>
 <p class="muted">Links Artikel per Ziehen hinzufügen – auf dem Handy einfach „+ Hinzufügen“ tippen. Rechts die Übergabemenge und den Konzertpreis festlegen.</p>
 <div class="row"><button class="primary" onclick="finishPacking()">✓ Konzertliste fertigstellen</button><button onclick="downloadHandoverPDF('${c.id}')">📄 PDF herunterladen</button><button onclick="printHandover('${c.id}')">🖨 Druckvorschau</button><button onclick="tab='pos';render()">Kasse öffnen</button></div><p class="pack-save-status">${c.packingFinished?'✅ Konzertliste fertiggestellt':'⚠ Konzertliste noch nicht fertiggestellt'}</p></div>
 <div class="packing-grid">
 <section class="panel"><h3>Gesamtlager · Artikel auswählen</h3><input style="width:100%" placeholder="Artikel oder Größe suchen" value="${esc(search)}" oninput="search=this.value;render()">
 ${rows.map(p=>`<div class="product" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${p.id}')"><img src="${p.photo||''}" alt=""><div class="grow"><b>${esc(p.name)}</b><div>${sizeBadge(p)}</div><small>Lager: ${stock(p)} · ${money(p.price)}</small></div><button onclick="packAdd('${p.id}')">+ Hinzufügen</button></div>`).join('')}</section>
 <section class="panel" ondragover="event.preventDefault();this.classList.add('drop-active')" ondragleave="this.classList.remove('drop-active')" ondrop="event.preventDefault();this.classList.remove('drop-active');packAdd(event.dataTransfer.getData('text/plain'))">
 <h3>🎸 Für dieses Konzert · ${selected.length} Positionen</h3><p>Warenwert (Verkaufspreise): <strong class="price-highlight packing-total">${money(total)}</strong></p>
 ${selected.length?selected.map(p=>{let x=c.packing[p.id],sold=concertSold(c.id,p.id);return `<div class="pack-line" id="pack-item-${p.id}"><b>${esc(p.name)}</b> ${sizeBadge(p)}
 <div class="row"><label>Mitnehmen <input type="number" min="${sold}" max="${Math.max(stock(p)+sold,sold)}" step="1" value="${x.qty}" oninput="packDirty('${p.id}')"></label>
 <label>Preis € <input type="number" min="0" step=".01" value="${concertPrice(p)}" oninput="packDirty('${p.id}')"></label>
 <button type="button" class="pack-confirm" onclick="packConfirm('${p.id}')">✓ Bestätigen</button><button ${sold?'disabled title="Bereits Verkäufe gebucht"':''} onclick="packRemove('${p.id}')">✕</button></div><div class="pack-save-status" aria-live="polite"></div>
 <small class="pack-stock-summary"><b>Mitgenommen: ${x.qty} · Verkauft: ${sold} · Noch beim Konzert: ${concertRemaining(c,p.id)}</b> · Gesamtlager: ${stock(p)}</small></div>`}).join(''):'<p>Ziehe Artikel hierher oder tippe links auf Hinzufügen.</p>'}
 </section></div>`;
}
function packAdd(id){
 let c=cs(),p=byId(id);if(!c||!p)return;
 c.packing=c.packing||{};
 if(!c.packing[id]){c.packing[id]={qty:Math.min(1,stock(p))};c.packingFinished=false;}
 save();render();
 // After re-rendering, scroll to the selected concert article and focus quantity.
 requestAnimationFrame(()=>setTimeout(()=>{
  const row=document.getElementById('pack-item-'+id);
  if(!row)return;
  row.scrollIntoView({behavior:'smooth',block:'center'});
  row.classList.add('pack-selected');
  const qty=row.querySelector('input[type="number"]');
  if(qty){qty.focus({preventScroll:true});qty.select()}
  setTimeout(()=>row.classList.remove('pack-selected'),2500);
 },90));
}
function packDirty(id){
 const row=document.getElementById('pack-item-'+id);if(!row)return;
 row.classList.remove('pack-confirmed');
 const status=row.querySelector('.pack-save-status');if(status)status.textContent='Noch nicht bestätigt';
}
function packConfirm(id){
 const c=cs(),p=byId(id),row=document.getElementById('pack-item-'+id);
 if(!c||!p||!row||!c.packing?.[id])return;
 const inputs=row.querySelectorAll('input[type="number"]');
 const qty=Number(inputs[0].value),price=Number(String(inputs[1].value).replace(',','.'));
 const sold=concertSold(c.id,id),max=stock(p)+sold;
 const status=row.querySelector('.pack-save-status');
 if(!Number.isInteger(qty)||qty<sold||qty>max){status.textContent='Ungültige Menge: '+sold+' bis '+max+' Stück.';return}
 if(!Number.isFinite(price)||price<0){status.textContent='Bitte gültigen Preis eingeben.';return}
 c.packingFinished=false;c.packing[id].qty=qty;c.prices=c.prices||{};c.prices[id]=Math.round(price*100)/100;
 try{save();row.classList.add('pack-confirmed');status.textContent='✓ Bestätigt und gespeichert';
 const summary=row.querySelector('.pack-stock-summary');
 if(summary)summary.innerHTML='<b>Mitgenommen: '+qty+' · Verkauft: '+sold+' · Noch beim Konzert: '+Math.max(0,qty-sold)+'</b> · Gesamtlager: '+stock(p);
 const finishStatus=document.querySelector('.panel > .pack-save-status');
 if(finishStatus)finishStatus.textContent='⚠ Konzertliste noch nicht fertiggestellt';
 const total=document.querySelector('.packing-total');if(total){total.textContent=money(db.products.filter(x=>c.packing[x.id]).reduce((sum,x)=>sum+c.packing[x.id].qty*concertPrice(x),0))}
 }catch(e){status.textContent='Speichern fehlgeschlagen: '+e.message}
}
function packQty(id,v){let c=cs(),p=byId(id);if(!c||!p)return;let n=Number(v),sold=concertSold(c.id,id);
 if(!Number.isInteger(n)||n<sold||n>stock(p)+sold){alert('Menge muss mindestens bereits verkaufte Stück ('+sold+') und höchstens verfügbarer Lagerbestand plus bereits verkaufte Stück ('+(stock(p)+sold)+') sein.');render();return}
 c.packing[id].qty=n;c.packingFinished=false;save();render()
}
function packRemove(id){let c=cs();if(concertSold(c.id,id)){alert('Artikel hat bereits Verkäufe und kann nicht entfernt werden.');return}delete c.packing[id];c.packingFinished=false;save();render()}
function finishPacking(){
 const c=cs();if(!c)return;
 const entries=Object.entries(c.packing||{});
 if(!entries.length){alert('Bitte zuerst Artikel für das Konzert auswählen.');return}
 for(const [id,v] of entries){const row=document.getElementById('pack-item-'+id);if(row&&row.querySelector('.pack-save-status')?.textContent.includes('Noch nicht bestätigt')){alert('Bitte alle geänderten Artikel zuerst einzeln bestätigen.');row.scrollIntoView({behavior:'smooth',block:'center'});return}}
 c.packingFinished=true;save();render();alert('✓ Konzertliste fertiggestellt. Übergabeliste kann jetzt als PDF heruntergeladen werden.');
}
function downloadHandoverPDF(cid){
 try{
 const c=db.concerts.find(x=>x.id===cid);if(!c)throw Error('Konzert nicht gefunden');
 const entries=db.products.filter(p=>c.packing?.[p.id]);if(!entries.length)throw Error('Bitte zuerst Artikel hinzufügen');
 const ascii=t=>String(t??'').replace(/[äÄöÖüÜß€]/g,k=>({'ä':'ae','Ä':'Ae','ö':'oe','Ö':'Oe','ü':'ue','Ü':'Ue','ß':'ss','€':'EUR'}[k])).replace(/[^\x20-\x7e]/g,'?');
 const safe=t=>ascii(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
 const objects=[''];const add=v=>(objects.push(v),objects.length-1);
 const regular=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
 const bold=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
 const pageIds=[];
 const chunkSize=16;
 for(let start=0;start<entries.length;start+=chunkSize){
  const commands=[];
  function line(t,x,y,size=10,b=false){commands.push(`BT /F${b?bold:regular} ${size} Tf 1 0 0 1 ${x} ${y} Tm (${safe(t)}) Tj ET`)}
  function rule(x,y,w,h){commands.push(`0.6 w ${x} ${y} ${w} ${h} re S`)}
  line('XIV DARK CENTURIES',36,795,22,true);line('MERCH - UEBERGABE- UND VERKAUFSLISTE',36,771,12,true);
  line('Konzert: '+c.name,36,747,11,true);line('Datum: '+c.date+'    Ort: '+(c.venue||'-'),36,730,10);
  line('Artikel',39,699,9,true);line('Groesse',240,699,9,true);line('Preis',310,699,9,true);line('Menge',368,699,9,true);line('Verkaufsstriche',414,699,9,true);line('Rest',548,699,9,true);
  rule(35,690,525,24);
  entries.slice(start,start+chunkSize).forEach((p,i)=>{
   const y=690-i*32;rule(35,y-32,525,32);
   const name=ascii(p.name);line(name.slice(0,34),39,y-13,8,true);if(name.length>34)line(name.slice(34,68),39,y-25,7);
   line((p.variant||'-').slice(0,12),240,y-19,9,true);
   line(Number(concertPriceFor(c,p)).toFixed(2)+' EUR',310,y-19,9);
   line(String(c.packing[p.id].qty),370,y-19,10,true);
  });
  const foot=145;
  line('Uebergeben: '+entries.reduce((a,p)=>a+c.packing[p.id].qty,0)+' Stueck',36,foot,10,true);
  line('Uebergabe durch: ______________________',36,105,10);
  line('Uebernommen von: ______________________',310,105,10);
  line('Je verkauftem Artikel einen Strich machen; Restbestand nach dem Konzert zaehlen.',36,75,9);
  line('Seite '+(pageIds.length+1)+' / '+Math.ceil(entries.length/chunkSize),480,35,9);
  const stream=commands.join('\n');const content=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
  const page=add(`<< /Type /Page /Parent PARENT /MediaBox [0 0 595 842] /Resources << /Font << /F${regular} ${regular} 0 R /F${bold} ${bold} 0 R >> >> /Contents ${content} 0 R >>`);
  pageIds.push(page);
 }
 const pages=add(`<< /Type /Pages /Kids [${pageIds.map(n=>n+' 0 R').join(' ')}] /Count ${pageIds.length} >>`);
 pageIds.forEach(n=>objects[n]=objects[n].replace('PARENT',pages+' 0 R'));
 const catalog=add(`<< /Type /Catalog /Pages ${pages} 0 R >>`);
 let pdf='%PDF-1.4\n',offsets=[0];for(let i=1;i<objects.length;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`}
 const xref=pdf.length;pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
 for(let i=1;i<objects.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
 pdf+=`trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
 const bytes=new Uint8Array([...pdf].map(c=>c.charCodeAt(0)&255));
 download('XIV_Uebergabeliste_'+c.date+'_'+ascii(c.name).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,30)+'.pdf',bytes,'application/pdf');
 }catch(e){alert('PDF konnte nicht erstellt werden: '+e.message)}
}
function concertPriceFor(c,p){return c.prices?.[p.id]===undefined?Number(p.price||0):Number(c.prices[p.id])}

 <p><b>Übergebene Artikel:</b> ${entries.reduce((a,p)=>a+c.packing[p.id].qty,0)} Stück &nbsp; <b>Warenwert:</b> ${money(entries.reduce((a,p)=>a+c.packing[p.id].qty*concertPrice(p),0))}</p>
 <div class="signatures"><div>Übergabe durch:<br><br>__________________________</div><div>Übernommen von:<br><br>__________________________</div></div>
 <p style="font-size:11px">Pro Verkauf einen Strich setzen. Nach Konzertende Restmenge zählen und eintragen. Datum / Unterschrift: __________________________</p></div>`;
 area.scrollIntoView({behavior:'smooth',block:'start'});

let scanMode='stock',scanBusy=false,scanDetector=null;
function openScan(mode){
 scanMode=mode;scanBusy=false;qrStop();document.getElementById('scan-overlay')?.remove();
 const layer=document.createElement('div');layer.id='scan-overlay';
 layer.style.cssText='position:fixed;inset:0;background:#08090df5;z-index:99999;overflow:auto;padding:18px;color:white';

 <p class="muted">Falls die Kamera nicht funktioniert, kannst du einen Code eingeben oder weiterhin Artikel manuell auswählen.</p>

}
function closeScan(){qrStop();document.getElementById('scan-overlay')?.remove()}
function scanCode(raw){
 if(scanBusy)return;
 const value=String(raw||document.getElementById('scan-code')?.value||'').trim();
 const id=value.startsWith('XIVMERCH:')?value.slice(9):value;
 const p=byId(id)||db.products.find(x=>x.sku&&x.sku===id);
 const message=document.getElementById('scan-message');
 if(!p){if(message)message.textContent='❌ Artikel nicht gefunden: '+value;return}
 scanBusy=true;
 if(scanMode==='sale'){
  if(!cs()){if(message)message.textContent='Bitte zuerst ein Konzert auswählen.';scanBusy=false;return}
  if(!cs().packing?.[p.id]){if(message)message.textContent='Artikel ist nicht in der Konzertliste: '+p.name;scanBusy=false;return}
  if(cartAvailable(cs(),p)<1){if(message)message.textContent='Nicht mehr verfügbar: '+p.name+' '+p.variant;scanBusy=false;return}
  closeScan();addToCart(p.id);
 }else{closeScan();qrOpen(p.id)}
 scanBusy=false;
}
async function startScanCamera(){
 const msg=document.getElementById('scan-message'),v=document.getElementById('scan-camera');
 if(!msg||!v)return;
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia){
  msg.textContent='Kamerascanner auf diesem Gerät / in dieser lokalen HTML-Datei nicht verfügbar. Code-Eingabe und manuelle Auswahl funktionieren weiterhin.';return
 }
 try{
  const formats=await BarcodeDetector.getSupportedFormats();
  if(!formats.includes('qr_code'))throw Error('QR-Code-Erkennung nicht unterstützt');
  qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  if(!document.getElementById('scan-overlay')){qrStop();return}
  v.srcObject=qrStream;v.style.display='block';await v.play();
  scanDetector=new BarcodeDetector({formats:['qr_code']});msg.textContent='QR-Code vor die Kamera halten';
  let detecting=false;
  qrTimer=setInterval(async()=>{
   if(detecting||scanBusy||v.readyState<2)return;
   detecting=true;
   try{const codes=await scanDetector.detect(v);if(codes.length)scanCode(codes[0].rawValue)}catch(e){}
   finally{detecting=false}
  },450);
 }catch(e){msg.textContent='Kamera nicht verfügbar: '+e.message+' – Artikel weiterhin manuell auswählen.';qrStop()}
}

async function qrStart(){
 const info=document.getElementById('qr-info'),v=document.getElementById('qr-video');
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia){info.textContent='Kamera-Scan hier nicht verfügbar. Artikelcode eingeben oder Suche nutzen.';return}
 try{qrStop();qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=qrStream;v.style.display='block';await v.play();const detector=new BarcodeDetector({formats:['qr_code']});info.textContent='QR-Code vor die Kamera halten';qrTimer=setInterval(async()=>{try{const found=await detector.detect(v);if(found.length)qrLookup(found[0].rawValue)}catch(e){}},600)}catch(e){info.textContent='Kamera nicht verfügbar: '+e.message;qrStop()}
}
function qrStop(){if(qrTimer){clearInterval(qrTimer);qrTimer=null}if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null}const v=document.getElementById('qr-video');if(v){v.srcObject=null;v.style.display='none'}}

function downloadCardsPDF(){
 // Eigenständiger PDF-Export ohne Browser-Druckdialog oder Internetverbindung.
 const ps=printIds.map(id=>byId(id)).filter(Boolean);
 if(!ps.length){alert('Keine Lagerkarten ausgewählt.');return}
 const latin=s=>String(s??'').replace(/[äÄöÖüÜß€]/g,c=>({'ä':'ae','Ä':'Ae','ö':'oe','Ö':'Oe','ü':'ue','Ü':'Ue','ß':'ss','€':'EUR'}[c])).replace(/[^\x20-\x7e]/g,'?');
 const escPdf=s=>latin(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
 let objects=['',''];const add=x=>{objects.push(x);return objects.length-1};
 const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
 const bold=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
 let pageIds=[];
 for(let i=0;i<ps.length;i+=6){
  let cmds=['0 0 0 rg'];
  ps.slice(i,i+6).forEach((p,j)=>{
   let col=j%2,row=Math.floor(j/2),x=34+col*290,y=842-35-row*265;
   cmds.push(`0.6 w ${x} ${y-239} 270 239 re S`);
   function line(t,dy,size=11,isBold=false){cmds.push(`BT /F${isBold?bold:font} ${size} Tf ${x+12} ${y-dy} Td (${escPdf(t)}) Tj ET`)}
   line('XIV DARK CENTURIES',23,13,true);
   const name=latin(p.name||'Artikel');line(name.slice(0,35),52,12,true);
   if(name.length>35)line(name.slice(35,70),68,10);
   line('GROESSE: '+(p.variant||'-'),100,19,true);
   line('Artikel-Nr.: '+(p.sku||'-'),128);
   line('Lagerfach: '+(p.location||'-'),149);
   line('Preis: '+Number(p.price||0).toFixed(2)+' EUR',174,14,true);
   line('Bestand: '+stock(p)+' Stueck',199,13,true);
  });
  const stream=cmds.join('\n');const content=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
  const page=add(`<< /Type /Page /Parent PARENT /MediaBox [0 0 595 842] /Resources << /Font << /F${font} ${font} 0 R /F${bold} ${bold} 0 R >> >> /Contents ${content} 0 R >>`);
  pageIds.push(page);
 }
 const pages=add(`<< /Type /Pages /Kids [${pageIds.map(n=>n+' 0 R').join(' ')}] /Count ${pageIds.length} >>`);
 pageIds.forEach(n=>objects[n]=objects[n].replace('PARENT',pages+' 0 R'));
 const catalog=add(`<< /Type /Catalog /Pages ${pages} 0 R >>`);
 let pdf='%PDF-1.4\n',offsets=[0];
 for(let n=1;n<objects.length;n++){offsets[n]=pdf.length;pdf+=`${n} 0 obj\n${objects[n]}\nendobj\n`}
 const xref=pdf.length;pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
 for(let n=1;n<objects.length;n++)pdf+=String(offsets[n]).padStart(10,'0')+' 00000 n \n';
 pdf+=`trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
 download('XIV_Lagerfachkarten.pdf',pdf,'application/pdf');
}
function closeCards(){const area=document.getElementById('printarea');area.classList.add('hidden');area.innerHTML=''}
function download(name,body,type){let blob=new Blob([body],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function sync(){return `<h2>Bandcamp & Datenaustausch</h2><div class="panel"><h2>Bandcamp-CSV importieren</h2><div class="drop" id="drop">CSV hierher ziehen oder Datei auswählen<br><br><input type="file" accept=".csv,text/csv" onchange="importCSV(this.files[0])"></div><p class="muted">Neue Artikel werden ergänzt. Bestehende Artikel werden anhand von package_id und Variante bzw. SKU zugeordnet. Die importierten Lagerzahlen werden als Basisbestand gesetzt; bereits gebuchte Verkäufe bleiben erhalten. Vor erneutem Import unbedingt sichern.</p></div><div class="panel"><h2>Synchronisierung zwischen Bandmitgliedern</h2><p>Jedes Bandmitglied exportiert seine aktuelle JSON-Sicherung und sendet sie an die Person, die den gemeinsamen Stand zusammenführt. Diese importiert alle Dateien und verteilt anschließend den zusammengeführten Stand wieder an alle Geräte. Doppelte Buchungen werden anhand ihrer IDs erkannt.</p><div class="row"><button class="primary" onclick="download('XIV_Merch_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db),'application/json')">Backup / Sync-Datei exportieren</button><label class="btn">Sync-Datei einlesen <input type="file" accept=".json" onchange="importSync(this.files[0])"></label></div><p class="danger">Achtung: Kein automatischer Cloud-Abgleich. Wenn Geräte unabhängig denselben Bestand verkaufen, können zwischenzeitlich negative Bestände entstehen. Vor dem Konzert Ware auf getrennte Verkaufsplätze aufteilen.</p></div><div class="panel"><small>Gerätekennung: ${esc(db.device)}</small><p>Für vollständige gemeinsame Live-Synchronisierung mit Anmeldung und automatischem Abgleich ist ein zentraler Dienst erforderlich.</p></div>`}
function parseCSV(text){let sep=(text.split(/\r?\n/)[0].match(/;/g)||[]).length>(text.split(/\r?\n/)[0].match(/,/g)||[]).length?';':',';let out=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){field+='"';i++}else quote=!quote}else if(c===sep&&!quote){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))out.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x!==''))out.push(row);return out}
function importCSV(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let lines=parseCSV(r.result.replace(/^\ufeff/,'')),heads=lines.shift().map(x=>x.trim());if(!heads.includes('item')||!heads.includes('quantity_DE'))throw Error('Bandcamp-Spalten item und quantity_DE fehlen');let count=0,added=0;for(let cells of lines){let x=Object.fromEntries(heads.map((h,i)=>[h,cells[i]||'']));let name=x.item||x.album||'Unbenannt',variant=x.option||'',id='bc-'+(x.package_id||'none')+'-'+name+'-'+variant;let p=db.products.find(p=>p.importKey===id)||db.products.find(p=>p.name===name&&p.variant===variant&&(!x.sku||p.sku===x.sku));if(!p){p={id:uuid(),name,variant,sku:x.sku||'',price:0,stock:0,location:'',photo:''};db.products.push(p);added++}p.importKey=id;p.price=Number(x.price||0);p.stock=Number(x.quantity_DE||0);count++}save();alert(`${count} Zeilen importiert, ${added} neue Artikel.`);render()}catch(e){alert('Importfehler: '+e.message)}};r.readAsText(file)}
function importSync(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let other=JSON.parse(r.result);if(!Array.isArray(other.products)||!Array.isArray(other.sales)||!Array.isArray(other.concerts))throw Error('Ungültige Sicherung');if(!confirm('Sync-Datei zusammenführen? Bitte vorher eigene Sicherung exportieren.'))return;db.cancelled=[...new Set([...(db.cancelled||[]),...(other.cancelled||[])])];for(let kind of ['products','concerts','sales','adjustments']){for(let entry of other[kind]||[]){let existing=db[kind].find(x=>x.id===entry.id);if(!existing)db[kind].push(entry);else if(kind==='concerts'){existing.prices={...(entry.prices||{}),...(existing.prices||{})};existing.packing={...(entry.packing||{}),...(existing.packing||{})}}else if(kind==='products'){if(!existing.photo&&entry.photo)existing.photo=entry.photo;if(!existing.location&&entry.location)existing.location=entry.location}}}db.sales=db.sales.filter(s=>!db.cancelled.includes(s.tx));save();alert('Zusammengeführt. Jetzt aktuelle Sync-Datei an alle anderen Geräte verteilen.');render()}catch(e){alert('Fehler: '+e.message)}};r.readAsText(file)}
const drop=()=>{let d=document.getElementById('drop');if(d){d.ondragover=e=>{e.preventDefault()};d.ondrop=e=>{e.preventDefault();importCSV(e.dataTransfer.files[0])}}};new MutationObserver(drop).observe(document.getElementById('appcontent'),{childList:true});render();
